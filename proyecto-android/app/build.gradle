// Módulo 'app'. La Fase 1.1 solo cambia la versión (versionCode 3):
// así Android sabe que hay una APK nueva y actualiza la instalada
// sin desinstalar nada (y sin perder el modelo descargado).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.elisotopo.subtilingus'
    compileSdk 34

    defaultConfig {
        applicationId 'com.elisotopo.subtilingus'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "v3.0"

        ndk {
            // Solo CPUs ARM de 64 bits (tu Redmi y casi todos los móviles
            // modernos): compila el doble de rápido y el APK es más pequeño.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
