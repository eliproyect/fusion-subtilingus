// Módulo 'app'. Novedad de la Fase 1: el bloque externalNativeBuild,
// que le dice a Gradle "hay código C/C++ en jni/, compílalo con el NDK
// usando CMake". El NDK lo instala el workflow automáticamente porque
// detecta archivos bajo jni/.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.elisotopo.subtilingus'
    compileSdk 34

    defaultConfig {
        applicationId 'com.elisotopo.subtilingus'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "v2.0"

        ndk {
            // Solo CPUs ARM de 64 bits (tu Redmi y casi todos los móviles
            // modernos): compila el doble de rápido y el APK es más pequeño.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
